<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garfoo — Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <header id="header">
    <div class="header-inner">
      <img class="logo" src="Garfoologin.png" alt="Logo Garfoo" />
      <nav>
        <a href="indexInicio.html" class="active">Início</a>
        <a href="sobrenosSemLogin.html">Sobre nós</a>
        <a href="entregadorSemLogin.html">Entregador</a>
        <a href="restauranteSemLogin.html">Restaurantes</a>
      </nav>
      <div class="header-actions">
        <a class="btn-e btn-outline" href="login.html"><b>Entrar</b></a>
        <a class="btn-e btn-primary" href="indexInicio.html#cadastro"><b>Cadastrar</b></a>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="ilustracao">
      <div class="circulo"></div>
      <img src="Garfoologin.png" alt="Bolsa Garfoo com alimentos" class="hero-bag-img" />
    </div>
    <div class="cartao">
      <h1 class="titulo">Bem-vindo de volta!</h1>
      <p class="subtitulo">Faça login para continuar.</p>
      <form class="form">
        <div class="input">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" placeholder="Digite o e-mail ou CPF" required />
        </div>
        <div class="input">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="************" required />
        </div>
        <div class="recsenha"><a href="recuperar-senha.html">Esqueci minha senha</a></div>
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
      <div class="login-footer"><span>Ainda não possui uma conta? <a href="indexInicio.html#cadastro">Cadastre-se</a></span></div>
    </div>
  </main>
    <script src="mascaras.js?v=20261115-3"></script>
</body>
</html>
