<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garfoo | Cardápio</title>
  <link rel="stylesheet" href="proprietario.css">
  <link rel="stylesheet" href="perfilAlternancia.css?v=20261118-6">
</head>

<body data-view="cardapio">
  <div class="owner-app">
    <aside class="sidebar">
      <a class="brand" href="proprietario.html">
        <img src="./Fotos/logoFooter.png" alt="Garfoo">
      </a>

      <p class="sidebar-label">Painel do proprietário</p>

      <nav class="sidebar-nav">
        <a class="nav-link" href="proprietario.html" data-view="restaurante">
          <span class="nav-icon">⌂</span> Meu restaurante
        </a>
        <a class="nav-link active" href="proprietario-cardapio.html" data-view="cardapio">
          <span class="nav-icon">⌘</span> Cardápio
        </a>
        <a class="nav-link" href="proprietario-pedidos.html" data-view="pedidos">
          <span class="nav-icon">▤</span> Pedidos
          <b id="pedido-badge">0</b>
        </a>
        <a class="nav-link" href="proprietario-relatorios.html" data-view="relatorios">
          <span class="nav-icon">▥</span> Relatórios
        </a>
        <a class="nav-link" href="proprietario-avaliacoes.html" data-view="avaliacoes">
          <span class="nav-icon">★</span> Avaliações
        </a>
        <a class="nav-link" href="proprietario-configuracoes.html" data-view="configuracoes">
          <span class="nav-icon">⚙</span> Configurações
        </a>
        <a class="nav-link" href="proprietario-ajuda.html" data-view="ajuda">
          <span class="nav-icon">?</span> Ajuda
        </a>
      </nav>

      <div class="sidebar-store-switcher">
        <button class="sidebar-store" id="sidebar-store-toggle" type="button"
          aria-expanded="false" aria-controls="sidebar-store-dropdown">
          <img id="sidebar-logo" src="./Fotos/logoFooter.png" alt="Logo do restaurante">
          <span class="sidebar-store-info">
            <strong id="sidebar-name">Carregando...</strong>
            <small>Restaurante parceiro</small>
          </span>
          <span class="sidebar-store-arrow" aria-hidden="true">⌄</span>
        </button>

        <div class="sidebar-store-dropdown" id="sidebar-store-dropdown" hidden>
          <div id="sidebar-restaurant-list"></div>
          <button type="button" class="add-restaurant-option" id="add-restaurant">
            <span>＋</span> Adicionar restaurante
          </button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="topbar-greeting">
          <strong id="topbar-greeting-name">Olá, $nome </strong>
          <span>Pronto para gerenciar seu restaurante?</span>
        </div>

        <div class="topbar-actions">
          <button class="outline-button" id="save-all" type="button">Salvar alterações</button>

          <button class="notification-button" type="button" aria-label="Notificações">
            <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
          </button>

                    <div class="account-menu" data-perfil-alternador>
            <button type="button" class="account-toggle" id="account-toggle" data-abrir-perfis aria-expanded="false" aria-label="Trocar modo">
              <img id="topbar-avatar" src="" alt="Foto do proprietário">
              <span id="topbar-owner-name"></span>
              <b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10l-3-3M17 17H7l3 3M17 7l3 3-3 3M7 17l-3-3 3-3"></path></svg></b>
            </button>
            <div class="account-dropdown" id="account-dropdown" data-menu-perfis hidden aria-label="Modos da conta">
              <a href="cliente.html" data-perfil-link="cliente">Modo Cliente</a>
              <a href="entregadorComLogin.html" data-perfil-link="entregador">Modo Entregador</a>
              <a href="proprietario.html" data-perfil-link="proprietario">Modo Proprietário</a>
            </div>
          </div>
        </div>
      </header>

      <section class="view active" id="cardapio">
        <div class="view-heading">
          <div>
            <p class="eyebrow">PRODUTOS</p>
            <h2>Cardápio</h2>
            <p>Itens vinculados ao seu restaurante.</p>
          </div>
          <button class="primary-button" id="new-item" type="button">+ Novo prato</button>
        </div>

        <div class="toolbar">
          <input id="menu-search" type="search" placeholder="Buscar item no cardápio">
          <span id="menu-count"></span>
        </div>

        <div class="menu-list" id="menu-list"></div>
      </section>
    </main>
  </div>

  <dialog id="item-dialog" class="item-dialog">
    <form method="dialog" id="item-form">
      <div class="dialog-heading">
        <h2 id="dialog-title">Novo prato</h2>
        <button type="button" class="close-dialog" aria-label="Fechar">×</button>
      </div>

      <input type="hidden" name="id">
      <label>Nome do prato<input name="nome" required></label>
      <label>Descrição<textarea name="descricao" rows="3" required></textarea></label>

      <div class="form-grid">
        <label>Preço (R$)<input name="preco" type="number" min="0" step="0.01" required></label>
        <label>Categoria<input name="categoria"></label>
      </div>

      <label>Imagem do prato<input name="imagem"></label>
      <button class="primary-button" type="submit">Salvar prato</button>
    </form>
  </dialog>

  <script src="proprietario.js"></script>
  <script src="contasUsuarioStore.js?v=20261118-8"></script>
  <script src="perfilAlternancia.js?v=20261118-8"></script>
</body>

</html>
